<!doctype html>
<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZCode verification</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px system-ui, sans-serif; background: #18181b; color: #fafafa; }
      main { width: min(92vw, 560px); padding: 24px; border: 1px solid #3f3f46; border-radius: 12px; background: #27272a; }
      #zcode-aliyun-captcha-button { width: 100%; min-height: 44px; }

  </head>

    <main>
      <p>Z.ai requires verification to continue.</p>
      <div id="zcode-aliyun-captcha-element"></div>

    </main>
  </body>
